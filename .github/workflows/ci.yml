name: My CI Pipeline

on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      
      - name: Create Packages
        run: npm init -y

      - name: Install Dependencies
        run: npm ci 

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      
      - name: Run Application
        run: node hello.js

      - name: Run Test
        run: npm test

